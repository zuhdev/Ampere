name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Compile
        run: npm run compile -w contracts
      - name: Tests (21-case matrix)
        run: npm test -w contracts
      - name: Typecheck
        run: npm run typecheck -w contracts

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck relay
        run: npm run typecheck -w relay
      - name: Typecheck api
        run: npm run typecheck -w api
      - name: Typecheck sdk
        run: npm run typecheck -w sdk

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck + build
        run: npm run build -w frontend

  smoke:
    runs-on: ubuntu-latest
    needs: [contracts]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Testnet smoke (read-only)
        env:
          BOT_TESTNET_RPC_URL: https://rpc.bohr.life
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          # read-only smoke against rpc.bohr.life — guarded so missing deploy artifacts skip cleanly
          npm run smoke:testnet -w contracts || \
            echo "smoke skipped (needs deployed addresses)"
        working-directory: .
      - name: Mainnet smoke (read-only)
        env:
          BOT_MAINNET_RPC_URL: https://rpc.botchain.ai
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          # read-only smoke against rpc.botchain.ai — skips until botMainnet.json exists
          npm run smoke:mainnet -w contracts || \
            echo "mainnet smoke skipped (needs botMainnet.json)"
        working-directory: .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (ghp_ / private keys)
        run: |
          if git grep -I -E "(ghp_[A-Za-z0-9]{36}|0x[0-9a-fA-F]{64})" -- ':!*.example' ':!.env.example'; then
            echo "::error::Potential secret found — do not commit private keys"
            exit 1
          fi
          echo "no secrets found"
